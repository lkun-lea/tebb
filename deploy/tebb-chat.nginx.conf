# Personal tebb HTTPS ingress. Only the listed exact paths reach the backend.
server {
    listen 443 ssl;
    server_name 8.136.145.17;
    ssl_certificate /etc/letsencrypt/live/tebb-public-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tebb-public-ip/privkey.pem;
    client_max_body_size 32k;
    access_log off;
    location = /cloud/v1/messages {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /cloud/v1/tools {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
    }
    location = /cloud/v1/events {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /cloud/v1/device-snapshot {
        client_max_body_size 260k;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
    }
    location / { return 404; }
}
