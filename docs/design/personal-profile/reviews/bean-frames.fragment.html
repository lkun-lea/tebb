const domains={communication:{name:'沟通方式',icon:'messages-square',short:'先结论，再依据',hint:'回答语言与表达偏好'},knowledge:{name:'知识背景',icon:'book-open',short:'Python 熟悉 · Rust 学习中',hint:'已确认的知识与学习背景'},goal:{name:'长期目标',icon:'flag',short:'完善 tebb 的产品体验',hint:'你明确保存的目标与方向'},project:{name:'项目背景',icon:'folder-open',short:'tebb · 云端同步与工作流',hint:'仅在相应项目中生效'}};
const initial=[{id:'pref-order',category:'communication',tag:'表达顺序',text:'回答先给出结论，再补充依据和操作步骤。',scope:'user',enabled:true,version:3,cloud:2},{id:'pref-language',category:'communication',tag:'语言',text:'优先使用中文，必要时保留英文技术术语。',scope:'user',enabled:true,version:1,cloud:1},{id:'knowledge-python',category:'knowledge',tag:'技术背景',text:'熟悉 Python，正在学习 Rust 的所有权与借用。',scope:'user',enabled:true,version:2,cloud:2},{id:'goal-product',category:'goal',tag:'产品方向',text:'持续完善 tebb，优先把核心任务做成可验证的完整流程。',scope:'user',enabled:true,version:1,cloud:1},{id:'project-focus',category:'project',tag:'当前项目',text:'tebb 当前优先完善云端资料同步与可视化工作流。',scope:'project',enabled:true,version:2,cloud:2},{id:'project-proof',category:'project',tag:'交付约定',text:'这个项目的交付需要附实际运行结果和对应验证证据。',scope:'project',enabled:true,version:1,cloud:1}];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const uiButton=(action,label,extra='',className='')=>`<button type="button" class="pm-button cursor-interaction ${className}" data-action="${action}" ${extra}>${label}</button>`;
const stateByLayout={};
root.querySelectorAll('.pm-app').forEach(app=>{
 const layout=app.dataset.layout;
 app.setAttribute('aria-label',layout==='map'?'画像地图布局':'档案工作台布局');
 const saved=window.openai?.widgetState?.privateContent?.[layout]||{};
 const state={category:domains[saved.category]?saved.category:'communication',selected:'pref-order',tab:'overview',editing:false,creating:false,deleting:false,context:saved.context==='project'?'project':'daily',toast:'',scenario:'populated',density:'comfortable',radius:16,records:structuredClone(initial)};
 stateByLayout[layout]=state;
 const motionNames={idle:'待机',wave:'挥手',nod:'点头',point:'指向',pause:'暂停'};
 const reducedMotion=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches||false;
 let actorTimer,actorGeneration=0;
 state.motionEnabled=!reducedMotion;
 state.motion='idle';
 state.lastMotion='';
 function motionControls(){
  return `<div class="pm-motion-bar"><span>动作预览</span><div class="pm-motion-buttons" role="group" aria-label="角色动作">${Object.entries(motionNames).map(([motion,label])=>`<button type="button" class="cursor-interaction" data-action="motion" data-motion="${motion}" aria-pressed="${state.motion===motion}">${label}</button>`).join('')}</div><span class="pm-motion-caption" role="status" aria-live="polite">${state.motionEnabled?'轻呼吸 · 偶尔眨眼':'动作已暂停'}</span></div>`;
 }
 function actor(){return app.querySelector('.pm-actor-button');}
 function cancelActor(){globalThis.clearTimeout?.(actorTimer);actorGeneration++;}
 function pose(frame){
  const sprite=actor()?.querySelector('.pm-character');
  if(!sprite)return;
  sprite.dataset.frame=String(frame);
  sprite.style.backgroundPosition=`${(frame%4)*100/3}% ${frame>=4?100:0}%`;
 }
 function motionStatus(motion,label){
  const button=actor();if(button)button.dataset.motion=motion;
  app.querySelectorAll('[data-action="motion"]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.motion===motion)));
  const caption=app.querySelector('.pm-motion-caption');if(caption)caption.textContent=label;
 }
 function visibleActor(){return !!actor()&&!app.closest('[data-variant]')?.hidden&&!document.hidden;}
 function later(callback,delay,generation=actorGeneration){
  actorTimer=globalThis.setTimeout?.(()=>{if(generation===actorGeneration&&root.isConnected)callback();},delay);
 }
 function idleActor(){
  cancelActor();pose(0);state.motion=state.motionEnabled?'idle':'pause';
  motionStatus(state.motion,state.motionEnabled?'轻呼吸 · 偶尔眨眼':'动作已暂停');
  if(!state.motionEnabled||reducedMotion||!visibleActor())return;
  function blink(){
   if(!visibleActor())return;
   pose(1);later(()=>{pose(0);later(blink,4600);},130);
  }
  later(blink,3500);
 }
 function playMotion(motion,direction,explicit=false){
  if(!state.motionEnabled&&!explicit&&motion!=='pause')return;
  cancelActor();
  if(motion==='pause'){state.motionEnabled=false;state.lastMotion='暂停';idleActor();return;}
  state.motionEnabled=true;state.motion=motion;state.lastMotion=motionNames[motion]||'待机';
  if(motion==='idle'){idleActor();return;}
  const left=['communication','goal'].includes(state.category);
  const pointFrame=(direction|| (left?'left':'right'))==='left'?6:7;
  const sequences={wave:[[0,80],[2,170],[3,170],[2,170],[3,170],[2,170],[0,120]],nod:[[0,80],[4,200],[4,100],[5,200],[0,140]],point:[[0,100],[pointFrame,300],[pointFrame,850],[0,150]]};
  const sequence=sequences[motion]||sequences.wave;
  motionStatus(motion,motion==='point'?'指向'+domains[state.category].name:motionNames[motion]);
  if(reducedMotion){pose(motion==='point'?pointFrame:motion==='nod'?4:2);return;}
  let step=0;
  function advance(){
   if(!visibleActor()){idleActor();return;}
   if(step>=sequence.length){idleActor();return;}
   const [frame,duration]=sequence[step++];pose(frame);later(advance,duration);
  }
  advance();
 }

 const scopeName=scope=>scope==='project'?'仅 tebb 项目':'所有对话';
 const records=()=>state.scenario==='empty'?[]:state.records.filter(r=>!r.deleted);
 const inCategory=()=>records().filter(r=>r.category===state.category);
 const selected=()=>inCategory().find(r=>r.id===state.selected)||inCategory()[0];
 function saveState(){
  const privateContent={};for(const [key,value]of Object.entries(stateByLayout))privateContent[key]={category:value.category,context:value.context};
  window.openai?.setWidgetState?.({modelContent:{design:'个人画像 · 卡通形象',character:'圆点小伙伴',motion:state.lastMotion||'待机',layout:layout==='map'?'画像地图':'档案工作台',category:domains[state.category].name,context:state.context==='project'?'tebb项目':'日常对话',lastAction:state.toast||'查看画像'},privateContent})?.catch(()=>{});
 }
 function status(record){return record.conflict?'待处理冲突':record.enabled?'已启用':'已停用';}
 function node(category){
  const def=domains[category],items=records().filter(r=>r.category===category),usable=items.filter(r=>r.enabled&&!r.conflict),conflict=items.some(r=>r.conflict);
  let label=usable.length?def.short:items.length?'这些信息已暂停使用':'尚未补充';
  if(items.some(r=>r.changed))label=items.find(r=>r.changed).text.slice(0,30);
  const scopes=[...new Set(items.map(r=>scopeName(r.scope)))];const scopeLabel=scopes.length>1?'多种使用范围':scopes[0]||(category==='project'?'项目范围':'全局范围');
  const stateLabel=conflict?'有待处理项':usable.length?'已确认 '+usable.length+' 条':items.length?'已停用':'待补充';
  return `<button type="button" class="pm-node cursor-interaction ${!items.length?'pm-node-empty':''} ${items.length&&!usable.length?'pm-node-off':''} ${conflict?'pm-node-conflict':''}" data-action="category" data-domain="${category}" aria-pressed="${state.category===category}" aria-label="查看${def.name}"><span class="pm-node-head">${icon(def.icon)}${def.name}</span><em>${esc(label)}</em><span class="pm-node-foot"><span class="pm-node-state">${stateLabel}</span><span>${scopeLabel}</span></span></button>`;
 }
 function map(){return `<section class="pm-model" aria-label="用户模型地图"><div class="pm-minihead"><h2>我的用户模型</h2><span>按已保存资料组织</span></div><div class="pm-map"><svg class="pm-map-lines" viewBox="0 0 600 368" preserveAspectRatio="none" role="img" aria-label="沟通、知识、目标和项目四类资料共同组成用户模型"><path d="M300 184 C300 80 205 76 105 76 M300 184 C300 80 395 76 495 76 M300 184 C300 288 205 292 105 292 M300 184 C300 288 395 292 495 292"/></svg><div class="pm-person"><div class="pm-orbit"><button type="button" class="pm-avatar pm-actor-button cursor-interaction" data-action="actor" data-motion="idle" aria-label="点击圆点小伙伴挥手">${character()}</button></div><div><strong>我的画像</strong><small>${records().length?'已保存 '+records().length+' 条资料':'尚无确认资料'}</small></div></div>${Object.keys(domains).map(node).join('')}</div>${motionControls()}<div class="pm-map-note">${icon('info')}项目约定保留适用范围</div><div class="pm-other"><span>其他资料 · 0 条</span><span>在“已有资料”中管理</span></div>${impact()}</section>`;}
 function folio(){return `<section aria-label="用户档案工作台"><div class="pm-folio-head"><button type="button" class="pm-folio-avatar pm-actor-button cursor-interaction" data-action="actor" data-motion="idle" aria-label="点击圆点小伙伴挥手">${character()}</button><div><h2>当前账号的实用画像</h2><p>${records().length?'沟通偏好、知识背景与长期方向':'先添加你希望保留的背景或偏好'}</p></div><span class="pm-pill">${records().length} 条已保存资料</span>${motionControls()}</div><div class="pm-folio-grid">${Object.keys(domains).map(node).join('')}</div><div class="pm-folio-bottom">${impact()}<aside class="pm-detail" aria-label="所选画像详情">${detail()}</aside></div></section>`;}
 function impact(){
  const usable=records().filter(r=>r.enabled&&!r.conflict&&(r.scope==='user'||state.context==='project'));
  const ordered=usable.some(r=>r.id==='pref-order'&&r.order!=='context_first'),known=usable.some(r=>r.category==='knowledge'),project=usable.some(r=>r.category==='project');
  const lead=ordered?'<strong>先给结论：</strong>可以按“依赖安装 → 启动 → 结果验证”三个步骤处理。':'我们可以依次查看依赖、启动方式与验证结果。';
  const rest=known?'解释实现时，可以沿用 Python 中熟悉的概念；Rust 部分再展开。':'涉及运行环境时，先补充基础说明。';
  const extra=project?'结合 tebb 的项目约定，交付时附运行结果与验证证据。':'';
  return `<section class="pm-impact" aria-label="对话影响示意"><div class="pm-minihead"><h2>${icon('message-circle')}对话影响示意</h2><div class="pm-context" aria-label="示例对话范围"><button type="button" class="cursor-interaction" data-action="context" data-value="daily" aria-pressed="${state.context==='daily'}">日常对话</button><button type="button" class="cursor-interaction" data-action="context" data-value="project" aria-pressed="${state.context==='project'}">tebb 项目</button></div></div><div class="pm-question">帮我说明一个项目从配置到运行的步骤。</div><div class="pm-answer"><span class="pm-petmark" aria-label="tebb"></span><div class="pm-answer-text">${lead}<br>${rest}${extra?'<br>'+extra:''}<div class="pm-applied">${usable.length?usable.map(r=>`<span>${esc(r.tag)}</span>`).join(''):'<span>暂无适用资料</span>'}</div></div></div><div class="pm-impact-foot"><span>固定示例 · 仅示意组织方式</span><button type="button" class="cursor-interaction" data-action="usage">查看采用情况 ${icon('arrow-up-right')}</button></div></section>`;
 }
 function detail(){
  const def=domains[state.category],item=selected(),list=inCategory();
  if(state.editing){
   const text=state.creating?'':item?.text||'',scope=state.creating?(state.category==='project'?'project':'user'):item?.scope||'user';
   return `<div class="pm-eyebrow">${icon(def.icon)}${def.name}</div><h3>${state.creating?'补充资料':'更正这条信息'}</h3><form class="pm-editor" data-editor><label>确认内容<textarea name="content" aria-label="画像确认内容" rows="5" maxlength="4000" required>${esc(text)}</textarea></label><label>使用范围<select name="scope" aria-label="画像使用范围"><option value="user" ${scope==='user'?'selected':''}>所有对话</option><option value="project" ${scope==='project'?'selected':''}>仅 tebb 项目</option></select></label><p class="pm-subnote">你确认后才作为保存资料。</p><footer>${uiButton('cancel-edit','取消')}<button type="submit" class="pm-button pm-primary cursor-interaction">确认更正</button></footer></form>`;
  }
  if(!item)return `<div class="pm-eyebrow">${icon(def.icon)}${def.name}</div><h3>这里尚未补充</h3><p class="pm-subnote">${def.hint}</p>${uiButton('new','添加第一条', '', 'pm-primary')}<p class="pm-subnote">信息不足时保留为空。</p>`;
  const conflict=item.conflict?`<section class="pm-conflict" aria-label="画像版本冲突"><div><label>本机内容</label>${esc(item.text)}</div><div><label>云端当前版本</label>${esc(item.remote)}</div><div class="pm-actions">${uiButton('resolve-local','保留本机')}${uiButton('resolve-cloud','采用云端')}</div></section>`:'';
  const deletion=state.deleting?`<section class="pm-conflict"><p>确认从这份画像中移除？</p><div class="pm-actions">${uiButton('cancel-delete','取消')}${uiButton('confirm-delete','确认删除','','pm-danger')}</div></section>`:'';
  return `<div class="pm-eyebrow">${icon(def.icon)}${def.name}</div><div class="pm-detail-title"><h3>已保存的理解</h3><span class="pm-pill ${item.conflict?'pm-warning':item.enabled?'pm-good':''}">${status(item)}</span></div><div class="pm-fact-picker" aria-label="选择画像条目">${list.map(r=>`<button type="button" class="cursor-interaction" data-action="fact" data-id="${r.id}" aria-pressed="${r.id===item.id}">${esc(r.tag)}</button>`).join('')}</div><p class="pm-fact">${esc(item.text)}</p>${conflict}<dl class="pm-meta"><dt>来源</dt><dd>${icon('user-round')} 你手动确认</dd><dt>使用范围</dt><dd>${scopeName(item.scope)}</dd><dt>资料更新</dt><dd>今天 · 示例时间</dd></dl><div class="pm-detail-actions">${uiButton('edit',icon('pencil')+' 更正')}${uiButton('toggle',item.enabled?'停用':'重新启用','', '')}${uiButton('delete','删除','','pm-danger')}</div>${deletion}<details class="pm-version"><summary>版本与同步</summary><p>本机 v${item.version} · 云端 v${item.cloud}<br>${item.conflict?'冲突解决前不用于后续选择':item.changed?'预览修改 · 尚未写入账号':'合成资料 · 展示同步后的样式'}</p></details><p class="pm-subnote">保存资料与某次实际发送分开查看。</p>`;
 }
 function registry(){return `<section aria-label="已有画像资料"><div class="pm-minihead"><h2>已有资料</h2><span>${records().length} 条 · 按类型组织</span></div><div class="pm-registry">${records().map(r=>`<button type="button" class="cursor-interaction" data-action="open-record" data-id="${r.id}">${icon(domains[r.category].icon)}<span><strong>${esc(r.text)}</strong><small>${domains[r.category].name} · ${scopeName(r.scope)}</small></span><span class="pm-pill ${r.conflict?'pm-warning':r.enabled?'pm-good':''}">${status(r)}</span></button>`).join('')||'<p class="pm-subnote">尚无确认资料，可先补充一条沟通偏好。</p>'}</div><aside class="pm-detail pm-registry-detail" aria-label="所选画像详情">${detail()}</aside></section>`;}
 function render(){
  app.style.setProperty('--pm-radius',state.radius+'px');app.dataset.density=state.density;
  const count=records().filter(r=>r.enabled&&!r.conflict).length;
  app.innerHTML=`<aside class="pm-rail"><div class="pm-brand"><b class="pm-dot"></b><span>tebb</span></div><nav aria-label="应用导航"><span>工作空间</span><button type="button" class="cursor-interaction" data-action="shell-note" aria-label="AI伙伴">${icon('messages-square')}<span>AI 伙伴</span></button><button type="button" class="cursor-interaction" data-action="shell-note" aria-label="工作台">${icon('layout-dashboard')}<span>工作台</span></button><button type="button" class="cursor-interaction" data-action="shell-note" aria-label="自动化">${icon('workflow')}<span>自动化</span></button><button type="button" class="cursor-interaction" data-action="shell-note" aria-label="项目">${icon('folder-open')}<span>项目</span></button></nav><nav aria-label="个人设置"><span>个人设置</span><button type="button" class="pm-on cursor-interaction" data-action="overview" aria-label="个人画像">${icon('fingerprint')}<span>个人画像</span></button><button type="button" class="cursor-interaction" data-action="shell-note" aria-label="账号与空间">${icon('settings-2')}<span>账号与空间</span></button></nav><div class="pm-account"><b>${character()}</b><span>当前账号<br>个人空间</span></div></aside><main class="pm-main"><div class="pm-topline"><span>设置 <span aria-hidden="true">/</span> 个人画像</span><span class="pm-demo">设计预览 · 合成资料</span></div><header class="pm-page-head"><div><h1>个人画像</h1><p>${records().length?count+' 条已启用资料 · 范围分别保留':'尚无确认资料'}</p></div>${uiButton('new',icon('plus')+' 补充资料','','pm-primary')}</header><div class="pm-sectionbar"><nav class="pm-tabs" aria-label="画像视图"><button type="button" class="cursor-interaction" data-action="tab" data-value="overview" aria-pressed="${state.tab==='overview'}">画像总览</button><button type="button" class="cursor-interaction" data-action="tab" data-value="records" aria-pressed="${state.tab==='records'}">已有资料</button></nav><span class="pm-sync">${icon('cloud-check')}同步状态放在资料详情</span></div>${state.toast?`<div class="pm-toast" role="status" aria-live="polite">${icon('check')}${esc(state.toast)}</div>`:''}<div class="pm-content">${state.tab==='records'?registry():layout==='map'?`<div class="pm-model-layout">${map()}<aside class="pm-detail" aria-label="所选画像详情">${detail()}</aside></div>`:folio()}</div><footer class="pm-footer"><span>${icon('shield-check')}内容由你确认 · 可随时更正或停用</span><span>示例交互不会写入真实账号</span></footer></main>`;
  if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  idleActor();
 }
 app.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');if(!button||!app.contains(button))return;
  const action=button.dataset.action,item=selected();state.toast='';
  if(action==='motion'||action==='actor'){playMotion(action==='actor'?'wave':button.dataset.motion,undefined,true);saveState();return;}
  if(action==='category'){state.category=button.dataset.domain;state.selected=inCategory()[0]?.id||'';state.editing=false;state.deleting=false;}
  else if(action==='fact'){state.selected=button.dataset.id;state.editing=false;state.deleting=false;}
  else if(action==='context')state.context=button.dataset.value;
  else if(action==='tab'){state.tab=button.dataset.value;state.editing=false;}
  else if(action==='overview')state.tab='overview';
  else if(action==='open-record'){const record=records().find(r=>r.id===button.dataset.id);if(record){state.category=record.category;state.selected=record.id;state.editing=false;state.deleting=false;}}
  else if(action==='new'){state.editing=true;state.creating=true;state.deleting=false;}
  else if(action==='edit'){state.editing=true;state.creating=false;state.deleting=false;}
  else if(action==='cancel-edit'){state.editing=false;state.creating=false;}
  else if(action==='toggle'&&item){item.enabled=!item.enabled;item.version++;state.toast='预览中已'+(item.enabled?'启用':'停用')+'这条信息';}
  else if(action==='delete')state.deleting=true;
  else if(action==='cancel-delete')state.deleting=false;
  else if(action==='confirm-delete'&&item){item.deleted=true;state.deleting=false;state.toast='预览中已移除这条信息';}
  else if(action==='resolve-local'&&item){item.conflict=false;item.version++;state.toast='预览中保留本机内容';}
  else if(action==='resolve-cloud'&&item){item.text=item.remote;item.order='context_first';item.conflict=false;item.changed=true;item.version++;state.toast='预览中采用云端版本';}
  else if(action==='usage'){state.toast='当前展示的是固定示例；实际发送的来源在调用检查台查看。';}
  else if(action==='shell-note'){state.toast='此预览聚焦个人画像，其他页面沿用现有导航。';}
  render();
  if(action==='category'||action==='open-record')playMotion('point');
  else if(action==='resolve-local'||action==='resolve-cloud')playMotion('nod');
  saveState();
  if(state.editing)app.querySelector('textarea')?.focus();
 });
 app.addEventListener('submit',event=>{
  if(!event.target.matches('[data-editor]'))return;event.preventDefault();
  const text=event.target.elements.content.value.trim(),scope=event.target.elements.scope.value;if(!text)return;
  if(state.scenario==='empty'){state.scenario='populated';state.records=[];if(state.designOptions)state.designOptions.scenario='populated';}
  if(state.creating){const record={id:'new-'+Date.now(),category:state.category,tag:'新确认资料',text,scope,enabled:true,version:1,cloud:0,changed:true};state.records.push(record);state.selected=record.id;}
  else{const record=selected();if(record){record.text=text;record.scope=scope;record.enabled=true;record.changed=true;record.version++;}}
  state.editing=false;state.creating=false;state.toast='已更新设计预览，真实账号未修改';render();playMotion('nod');saveState();
 });
 render();
 if(globalThis.Tweak){
  const options={scenario:'populated',density:'comfortable',radius:16};state.designOptions=options;
  const tweaks=new Tweak({container:app,onChange:()=>{
   if(options.scenario!==state.scenario){state.records=structuredClone(initial);state.scenario=options.scenario;state.selected='pref-order';state.category='communication';state.editing=false;state.deleting=false;state.toast='';if(state.scenario==='conflict'){state.records[0].conflict=true;state.records[0].remote='先把推理过程讲清楚，最后再给结论。';}}
   state.density=options.density;state.radius=options.radius;render();
  }});
  tweaks.addSelect(options,'scenario',{label:'资料状态',options:[{label:'已有画像',value:'populated'},{label:'刚开始使用',value:'empty'},{label:'有一项冲突',value:'conflict'}]});
  tweaks.addSelect(options,'density',{label:'信息密度',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]});
  tweaks.addSlider(options,'radius',{label:'卡片圆角',min:8,max:24,step:2,unit:'px'});
 }
});
})();
</script>
