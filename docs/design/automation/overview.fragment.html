</style>
<script>
(()=>{
const root=document.getElementById('tebb-automation-review');
if(!root)return;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})};
const catalog=[['read','读取网页','file-text'],['search','搜索资料','search'],['ai','AI 处理','sparkles'],['condition','条件判断','git-branch'],['document','创建文档','file-plus-2'],['base','写入表格','table-2'],['message','发送群消息','send']];
const makeNews=()=>({name:'大厂开源与技术动向',nodes:[{id:'trigger',kind:'trigger',name:'定时触发',sub:'每天 09:00',x:.5,y:86},{id:'sources',kind:'search',name:'采集官方来源',sub:'近 3 天 · 最多 8 条',x:.5,y:210},{id:'report',kind:'ai',name:'整理技术日报',sub:'输出 5 条技术动向',x:.5,y:334},{id:'doc',kind:'document',name:'创建飞书文档',sub:'待确认云盘位置',x:.17,y:446,missing:true},{id:'base',kind:'base',name:'写入多维表格',sub:'结果表 · 按回执去重',x:.5,y:446},{id:'msg',kind:'message',name:'发送群消息',sub:'待选择目标群',x:.83,y:446,missing:true}],edges:[['trigger','sources'],['sources','report'],['report','doc'],['report','base'],['report','msg']]});
const makeVideo=()=>({name:'视频学习笔记',nodes:[{id:'trigger',kind:'trigger',name:'手动触发',sub:'输入视频链接',x:.5,y:64},{id:'video',kind:'read',name:'读取视频字幕',sub:'核对字幕完整性',x:.5,y:200},{id:'report',kind:'ai',name:'整理学习笔记',sub:'保留时间点与来源',x:.5,y:336},{id:'doc',kind:'document',name:'保存飞书文档',sub:'待确认保存位置',x:.5,y:472,missing:true}],edges:[['trigger','video'],['video','report'],['report','doc']]});
const makeBlank=()=>({name:'新的工作流',nodes:[{id:'trigger',kind:'trigger',name:'手动触发',sub:'从这里开始',x:.5,y:90}],edges:[]});
const makeDocument=()=>({name:'飞书文档发布',lastRun:{label:'已完成',time:'今天 10:42',tone:'done'},nodes:[{id:'trigger',kind:'trigger',name:'手动触发',sub:'输入发布正文',x:.5,y:130},{id:'doc',kind:'document',name:'创建飞书文档',sub:'云盘 · 工作记录',target:'云盘 / 工作记录（示例）',x:.5,y:320,missing:false}],edges:[['trigger','doc']]});
root.querySelectorAll('.tw-shell').forEach((app,appIndex)=>{
 const studio=app.dataset.layout==='studio',editor=app.querySelector('.tw-editor');
 const state={view:'home',flow:'news',drafts:{news:makeNews(),video:makeVideo(),document:makeDocument()},selected:studio?['report']:[],pane:studio?'node':'',tab:'配置',focus:false,guides:true,dirty:false,trace:false,connecting:'',edge:null,runStep:0,running:false,version:'v3',theme:'inherit',radius:13};
 state.drafts.news.lastRun={label:'等待确认发布目标',time:'今天 09:00',tone:'wait'};
 const current=()=>state.drafts[state.flow];
 const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'自动化界面',layout:'卡片首页与画布',view:state.view,workflow:state.flow,panel:state.pane,focus:state.focus},privateContent:null}).catch(()=>{})};
 editor.innerHTML=`<div class="tw-top"><div class="tw-flow-title"><button type="button" class="tw-button tw-ghost" data-action="home">${icon('arrow-left')}工作流</button><span class="tw-back-divider"></span><span class="tw-flow-icon">${icon('workflow')}</span><select class="tw-flow-select" aria-label="切换已有工作流"><option value="news">大厂开源与技术动向</option><option value="video">视频学习笔记</option><option value="document">飞书文档发布</option></select><span class="tw-save-state">已保存</span></div><div class="tw-actions"><button type="button" class="tw-button tw-ghost" data-action="new">${icon('plus')}新建</button><button type="button" class="tw-button" data-action="save">保存</button><button type="button" class="tw-button tw-primary" data-action="run">${icon('play')}试运行</button></div></div>
 <div class="tw-underbar"><div class="tw-underbar-group"><button type="button" class="tw-button tw-ghost" data-action="schedule">${icon('clock-3')}<span data-schedule-label>每天 09:00</span></button><span>·</span><span class="tw-version"><span></span>草稿与运行分开</span></div><div class="tw-actions"><button type="button" class="tw-button tw-ghost" data-action="history">${icon('history')}运行记录</button><button type="button" class="tw-button tw-ghost" data-action="focus">${icon('maximize-2')}<span data-focus-label>专注画布</span></button></div></div>
 <div class="tw-body ${studio?'tw-with-panel':''}">${studio?`<aside class="tw-node-rail"><span>原子能力</span>${catalog.map(([kind,name,ico])=>`<button type="button" class="tw-button tw-ghost" draggable="true" data-add="${kind}">${icon(ico)}${name.replace('飞书','')}</button>`).join('')}<button type="button" class="tw-button tw-ghost" data-action="assistant">${icon('bot')}伙伴搭建</button></aside>`:''}<div class="tw-canvas" aria-label="可拖动和连接的工作流画布"><span class="tw-stage-caption">${studio?'设计 / 大厂开源与技术动向':'工作流 / 大厂开源与技术动向'}</span><svg class="tw-lines" role="img" aria-label="工作流节点之间的连接关系"></svg><div class="tw-node-layer"></div><div class="tw-palette" hidden></div><div class="tw-canvas-toolbar"><button type="button" class="tw-button" data-action="palette" aria-label="添加节点">${icon('plus')}</button><span class="tw-separator"></span><button type="button" class="tw-button" data-action="fit" aria-label="整理并适应画布">${icon('scan')}</button><button type="button" class="tw-button" data-action="horizontal" aria-label="多选节点后水平对齐">${icon('align-vertical-justify-center')}</button><button type="button" class="tw-button" data-action="vertical" aria-label="多选节点后竖直对齐">${icon('align-horizontal-justify-center')}</button><button type="button" class="tw-button" data-action="guides" aria-pressed="true" aria-label="切换对齐吸附">${icon('magnet')}</button><span class="tw-separator"></span><button type="button" class="tw-button" data-action="assistant">${icon('sparkles')}伙伴</button></div></div><aside class="tw-inspector" ${studio?'':'hidden'} aria-label="节点及工作流设置"></aside></div>
 <div class="tw-run-panel" ${studio?'':'hidden'} aria-label="试运行与节点回执"></div>
 <div class="tw-flow-foot"><div class="tw-flow-foot-left"><span data-node-count>6 个节点 · 5 条连接</span><span>Shift 多选 · 拖动圆点连线</span></div><button type="button" class="tw-button tw-ghost" data-action="debug">${icon('panel-bottom')}逐步调试</button></div><div class="tw-status" role="status" aria-live="polite">点击节点查看设置；拖动节点可看到对齐参考线。</div>`;
 const canvas=editor.querySelector('.tw-canvas'),layer=editor.querySelector('.tw-node-layer'),svg=editor.querySelector('.tw-lines'),panel=editor.querySelector('.tw-inspector'),body=editor.querySelector('.tw-body'),palette=editor.querySelector('.tw-palette'),runPanel=editor.querySelector('.tw-run-panel'),status=editor.querySelector('.tw-status');
 const home=document.createElement('section');home.className='tw-home';home.setAttribute('aria-label','已有工作流卡片总览');editor.before(home);
 let gesture=null,hoverPoint=null,timer=null;
 const tell=message=>{status.textContent=message};
 const dirty=()=>{state.dirty=true;current().dirty=true;editor.querySelector('.tw-save-state').textContent='有未保存修改'};
 const selectedNode=()=>current().nodes.find(n=>n.id===state.selected[0]);
 const small=()=>canvas.clientWidth<360;
 const nodeWidth=()=>small()?Math.min(188,canvas.clientWidth-34):Math.max(124,Math.min(174,(canvas.clientWidth-52)/3));
 function position(n,index){const w=nodeWidth(),width=canvas.clientWidth;if(small())return {x:(width-w)/2,y:62+index*132};return {x:Math.max(12,Math.min(width-w-12,n.x*width-w/2)),y:n.y-40}}
 function renderNodes(){
   if(!canvas.clientWidth)return;
   const g=current();canvas.style.setProperty('--tw-node-width',nodeWidth()+'px');
   layer.innerHTML=g.nodes.map((n,i)=>{const p=position(n,i),ico=n.kind==='trigger'?'clock-3':catalog.find(v=>v[0]===n.kind)?.[2]||'file-text';return `<div class="tw-node ${state.selected.includes(n.id)?'tw-selected':''}" role="group" aria-label="${esc(n.name)}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px"><button type="button" class="tw-node-select" aria-label="打开${esc(n.name)}设置" aria-pressed="${state.selected.includes(n.id)}" data-node-select="${n.id}"><span class="tw-node-head"><span class="tw-symbol">${icon(ico)}</span><span>${esc(n.name)}</span></span><span class="tw-node-sub ${n.missing?'tw-needs':''}"><span class="tw-status-dot"></span><span>${esc(n.sub)}</span></span></button>${n.kind!=='trigger'?`<button type="button" class="tw-port tw-port-in" data-port="in" aria-label="连接到${esc(n.name)}"></button>`:''}<button type="button" class="tw-port tw-port-out" data-port="out" aria-label="从${esc(n.name)}连接"></button></div>`}).join('');
   editor.querySelector('[data-node-count]').textContent=`${g.nodes.length} 个节点 · ${g.edges.length} 条连接`;
   icons();draw();
 }
 function box(id){const el=layer.querySelector(`[data-id="${id}"]`);if(!el)return null;return {x:parseFloat(el.style.left)+el.offsetWidth/2,y:parseFloat(el.style.top),h:el.offsetHeight}}
 function curve(a,b){const delta=Math.max(28,Math.abs(b.y-a.y)*.48);return `M${a.x},${a.y} C${a.x},${a.y+delta} ${b.x},${b.y-delta} ${b.x},${b.y}`}
 function draw(guides=[]){
   if(!canvas.clientWidth)return;
   let paths=current().edges.map(([a,b],i)=>{const x=box(a),y=box(b);if(!x||!y)return '';let d=curve({x:x.x,y:x.y+x.h},{x:y.x,y:y.y});const branches=current().edges.filter(e=>e[0]===a);if(small()&&branches.length>1){const k=branches.findIndex(e=>e[1]===b),lane=k%2?canvas.clientWidth-12:12+k*5,from=x.y+x.h;d=`M${x.x},${from} C${x.x},${from+22} ${lane},${from+22} ${lane},${from+32} L${lane},${y.y-20} Q${lane},${y.y} ${y.x},${y.y}`;}return `<path class="tw-edge-hit" d="${d}" data-edge="${i}"/><path class="tw-edge ${state.edge===i?'tw-edge-selected':''}" d="${d}" data-edge="${i}"/>`}).join('');
   if(state.connecting&&hoverPoint){const a=box(state.connecting);if(a)paths+=`<path class="tw-temp-edge" d="${curve({x:a.x,y:a.y+a.h},hoverPoint)}"/>`}
   paths+=guides.map(v=>v.axis==='x'?`<line class="tw-guide" x1="${v.at}" x2="${v.at}" y1="30" y2="${canvas.clientHeight-60}"/>`:`<line class="tw-guide" x1="12" x2="${canvas.clientWidth-12}" y1="${v.at}" y2="${v.at}"/>`).join('');
   svg.innerHTML=paths;
 }
 function setPanel(kind){state.pane=kind;panel.hidden=!kind;body.classList.toggle('tw-with-panel',!!kind);renderPanel();requestAnimationFrame(renderNodes);persist()}
 function panelHeader(title,sub='NODE SETTINGS'){return `<div class="tw-panel-heading"><div><div class="tw-panel-eyebrow">${sub}</div><h3>${title}</h3></div><button type="button" class="tw-panel-close" data-action="close-panel" aria-label="关闭面板">×</button></div>`}
 function field(label,value,extra='',type='input'){return `<label class="tw-field">${label}${type==='textarea'?`<textarea ${extra}>${esc(value)}</textarea>`:`<input value="${esc(value)}" ${extra}>`}</label>`}
 function renderPanel(){
   if(!state.pane)return;
   if(state.pane==='schedule'){
     panel.innerHTML=panelHeader('触发与计划','TRIGGER')+`<div class="tw-schedule"><label class="tw-field">触发方式<select data-schedule-kind><option value="每天">每天</option><option value="工作日">工作日</option><option value="手动">仅手动</option></select></label>${field('触发时间','09:00','data-schedule-time type="time"')}<span class="tw-field-help">北京时间 · 计划绑定已保存版本</span><button type="button" class="tw-button tw-primary" data-action="apply-schedule">保存计划（演示）</button></div>`;
   }else if(state.pane==='assistant'){
     panel.innerHTML=panelHeader('让伙伴帮你搭建','AI COMPANION')+`<div class="tw-field-help">描述你想完成的任务，先生成可检查的流程草稿。</div>${field('我想要…','读取视频字幕，整理成带时间点的学习笔记，保存到飞书文档。','data-ai-prompt','textarea')}<button type="button" class="tw-button tw-primary" data-action="ai-build">${icon('sparkles')}生成草稿（演示）</button><div class="tw-binding">发布目标由你指定，生成草稿不会执行。</div><div class="tw-panel-foot"><span>能力也可以复用</span><button type="button" class="tw-button tw-ghost" data-action="capability">新增能力</button></div>`;
   }else if(state.pane==='capability'){
     panel.innerHTML=panelHeader('新增原子能力','REUSABLE CAPABILITY')+field('能力名称','官方文档读取','data-capability-name')+`<label class="tw-field">基于已有能力<select><option>读取网页</option><option>搜索资料</option><option>AI 处理</option></select></label>`+field('能力说明','读取指定官方文档，保留来源与正文。','','textarea')+`<button type="button" class="tw-button tw-primary" data-action="add-capability">放入画布（演示）</button><span class="tw-field-help">保存为能力后，可供其他工作流和 AI 伙伴复用。</span>`;
   }else if(state.pane==='edge'){
     const e=current().edges[state.edge];panel.innerHTML=panelHeader('连接关系','CONNECTION')+(e?`<div class="tw-binding">${esc(current().nodes.find(n=>n.id===e[0])?.name)}<br>↓<br>${esc(current().nodes.find(n=>n.id===e[1])?.name)}</div><button type="button" class="tw-button" data-action="delete-edge">删除这条连接</button>`:'<p class="tw-field-help">选择画布上的连接线。</p>');
   }else if(state.pane==='history'){
     panel.innerHTML=panelHeader('运行记录','RUN HISTORY')+`<div class="tw-panel-eyebrow">示例记录</div><div class="tw-binding">今天 09:00 · 待确认发布目标<br>技术动向日报 · v3</div><button type="button" class="tw-button" data-action="debug">查看节点回执</button><span class="tw-field-help">运行快照单独查看，不替换正在编辑的草稿。</span>`;
   }else{
     const n=selectedNode();if(!n){panel.innerHTML=panelHeader('节点设置')+`<div class="tw-empty-panel">${icon('mouse-pointer-2')}<p>选中一个节点<br>查看配置、输入和输出</p></div>`;icons();return;}
     const tabs=['配置','输入','输出'];let content='';
     if(state.tab==='输入')content=`<div class="tw-panel-eyebrow">来自上游节点</div><div class="tw-binding">${n.kind==='ai'?'采集官方来源 → 已核实材料':n.kind==='trigger'?'手动文字或已保存的定时输入':'整理技术日报 → 报告正文'}</div><span class="tw-field-help">连接决定执行顺序，字段引用决定使用哪些资料。</span>`;
