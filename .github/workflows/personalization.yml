name: Personalization cloud contract
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'desk_companion/accounts/personalization_cloud.py', 'scripts/*personalization_cloud.py', 'tests/test_personalization_cloud.py', '.github/workflows/personalization.yml']
  pull_request:
    paths: ['supabase/**', 'desk_companion/accounts/personalization_cloud.py', 'scripts/*personalization_cloud.py', 'tests/test_personalization_cloud.py', '.github/workflows/personalization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: supabase/tests/runner
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv sync --locked --only-group cloud
      - name: Run database and Python acceptance in the locked cloud environment
        run: uv run --locked --only-group cloud npm test
        working-directory: supabase/tests/runner
      - run: uv run --locked --only-group cloud python -m unittest discover -s tests -p test_personalization_cloud.py -v
